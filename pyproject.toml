[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geometryscript"
version = "0.2.0"
description = "A Python API for creating Blender's Geometry Nodes with code"
readme = "README.md"
license = "GPL-3.0"
authors = [
    {name = "Carson Katri", email = "carson@katri.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = "~=3.11.0"
dependencies = ["bpy>=4.5.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/carson-katri/geometry-script"
Documentation = "https://carson-katri.github.io/geometry-script/"
Repository = "https://github.com/carson-katri/geometry-script"
Issues = "https://github.com/carson-katri/geometry-script/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true